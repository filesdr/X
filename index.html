<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying, Please wait...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Roboto, Arial, sans-serif;
    }

    body {
      background-color: #f0f5fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* ===== MAIN CARD (Restored smooth style) ===== */
    .main-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 12px 32px rgba(0, 30, 60, 0.08), 
                  0 4px 12px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 26px;
      font-weight: 700;
      color: #0b2b3b;
      letter-spacing: -0.5px;
    }

    .header-sub {
      font-size: 14px;
      color: #4a6579;
      border-left: 4px solid #2e9e6b;
      padding-left: 12px;
      background: rgba(46, 158, 107, 0.05);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      margin-top: -8px;
    }

    /* ===== 10s LOADING BAR ===== */
    .loading-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .loading-text {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #1f4a5f;
      font-weight: 500;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #d9e3ec;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2e9e6b, #3fc47f, #2e9e6b);
      background-size: 200% 100%;
      border-radius: 10px;
      transition: width 0.1s linear;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }

    /* ===== CONTINUE STAGE (replaces captcha) ===== */
    .continue-stage {
      display: none;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      padding: 8px 0;
    }

    .continue-stage p {
      font-size: 15px;
      color: #1f4a5f;
      font-weight: 500;
    }

    .continue-btn {
      background: linear-gradient(90deg, #2e9e6b, #3fc47f);
      color: #ffffff;
      border: none;
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 6px 16px rgba(46, 158, 107, 0.35);
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .continue-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(46, 158, 107, 0.45);
      background: linear-gradient(90deg, #288a5d, #38b473);
    }

    .continue-btn:active {
      transform: translateY(0);
      box-shadow: 0 4px 10px rgba(46, 158, 107, 0.35);
    }

    .hidden {
      display: none !important;
    }

    .footnote {
      text-align: center;
      font-size: 12px;
      color: #8ba3b8;
      border-top: 1px solid #eef2f6;
      padding-top: 20px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="main-card">
    
    <!-- Header -->
    <div class="header-title">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e25c4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#f7f1f0" />
        <path d="M12 8v4" />
        <path d="M12 16h.01" />
      </svg>
      Please Wait..
    </div>
    <div class="header-sub">please wait..Checking for Bot activities</div>

    <!-- 10s Loading -->
    <div id="loadingStage" class="loading-section">
      <div class="loading-text">
        <span>Preparing secure session...</span>
        <span id="loadingPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="loadingFill"></div>
      </div>
    </div>

    <!-- CONTINUE STAGE (replaces captcha) -->
    <div id="continueStage" class="continue-stage">
      <p>Verification complete. You may continue.</p>
      <button class="continue-btn" id="continueBtn">CONTINUE</button>
    </div>

    <div class="footnote">Protected by anti-bot verification</div>
  </div>

  <script>
    (function() {
      const loadingStage = document.getElementById('loadingStage');
      const loadingFill = document.getElementById('loadingFill');
      const loadingPercent = document.getElementById('loadingPercent');

      const continueStage = document.getElementById('continueStage');
      const continueBtn = document.getElementById('continueBtn');

      // ===== DESTINATION URL (replace this later) =====
      const DESTINATION_URL = 'https://y434f.bemobtrcks.com/click';

      // 10-Second Loading Animation
      let progress = 0;
      const loadingDuration = 10000;
      const stepTime = 50;
      const totalSteps = loadingDuration / stepTime;
      const increment = 100 / totalSteps;

      const loadInterval = setInterval(() => {
        progress += increment;
        if (progress >= 100) {
          progress = 100;
          clearInterval(loadInterval);

          loadingFill.style.width = '100%';
          loadingPercent.textContent = '100%';

          // Transition to CONTINUE stage
          loadingStage.classList.add('hidden');
          continueStage.style.display = 'flex';
        } else {
          loadingFill.style.width = progress + '%';
          loadingPercent.textContent = Math.floor(progress) + '%';
        }
      }, stepTime);

      // Continue button redirect
      continueBtn.addEventListener('click', () => {
        window.location.href = DESTINATION_URL;
      });

    })();
  </script>
</body>
</html>
